# Lint and build the Next.js app (API, admin and the static frontend) on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      - run: npm run lint
      - run: npm run build

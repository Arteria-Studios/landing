# Publishes the static frontend (public/) to GitHub Pages on every push to main.
# Pages has no server: the site runs on the content bundled in public/assets/main.js
# and the contact form falls back to email. The full app is deployed with Docker.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Static frontend only: API, admin and database need the Next.js server.
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
